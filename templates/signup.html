
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account | ExpenseFlow</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body class="auth-page">

    <div class="auth-background-circle circle-one"></div>
    <div class="auth-background-circle circle-two"></div>

    <nav class="auth-navbar">
        <a href="/" class="brand">
            <span class="brand-icon">💰</span>
            ExpenseFlow
        </a>

        <a href="/" class="auth-home-nav">
            ← Back to Home
        </a>
    </nav>

    <main class="auth-main">

        <div class="auth-card">

            <div class="auth-icon">✨</div>

            <span class="auth-welcome">GET STARTED</span>

            <h1>Create Account</h1>

            <p class="auth-subtitle">
                Join ExpenseFlow and start managing your money smarter.
            </p>

            <form method="POST">

                <!-- Username -->

                <div class="auth-field">

                    <label for="username">Username</label>

                    <div class="auth-input-wrapper">

                        <span>👤</span>

                        <input
                            type="text"
                            id="username"
                            name="username"
                            placeholder="Choose a username"
                            autocomplete="username"
                            required
                        >

                    </div>

                </div>

                <!-- Password -->

                <div class="auth-field">

                    <label for="password">Password</label>

                    <div class="auth-input-wrapper">

                        <span>🔒</span>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Create a password"
                            autocomplete="new-password"
                            required
                        >

                        <button
                            type="button"
                            class="password-toggle"
                            onclick="togglePassword()"
                            aria-label="Show password"
                        >
                            Show
                        </button>

                    </div>

                </div>

                <p class="signup-hint">
                    Choose a strong password to protect your account.
                </p>

                <button type="submit" class="auth-btn">
                    Create My Account <span>→</span>
                </button>

            </form>

            <div class="auth-divider">
                <span>OR</span>
            </div>

            <p class="auth-footer">
                Already have an account?
                <a href="{{ url_for('login') }}">Login Here</a>
            </p>

            <div class="auth-security">
                <span>🔒</span>
                Your financial journey starts here.
            </div>

        </div>

        <div class="auth-bottom-text">
            Track better. Save smarter. Live better.
        </div>

    </main>

    <script>
        function togglePassword() {

            const password = document.getElementById("password");
            const toggle = document.querySelector(".password-toggle");

            if (password.type === "password") {
                password.type = "text";
                toggle.textContent = "Hide";
                toggle.setAttribute("aria-label", "Hide password");
            } else {
                password.type = "password";
                toggle.textContent = "Show";
                toggle.setAttribute("aria-label", "Show password");
            }

        }
    </script>

</body>
</html>

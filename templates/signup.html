<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Sign Up</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

</head>

<body>

    <div class="container mt-5">

        <div class="row justify-content-center">

            <div class="col-md-5">

                <div class="card shadow">

                    <div class="card-body">

                        <h2 class="text-center mb-4">
                            Create Account
                        </h2>

                        <p class="text-center text-muted">
                            Personal Expense Tracker
                        </p>

                        <form method="POST">

                            <!-- Username -->

                            <div class="mb-3">

                                <label class="form-label">
                                    Username
                                </label>

                                <input
                                    type="text"
                                    name="username"
                                    class="form-control"
                                    placeholder="Enter username"
                                    required
                                >

                            </div>


                            <!-- Password -->

                            <div class="mb-4">

                                <label class="form-label">
                                    Password
                                </label>

                                <input
                                    type="password"
                                    name="password"
                                    class="form-control"
                                    placeholder="Enter password"
                                    required
                                >

                            </div>


                            <!-- Submit -->

                            <button
                                type="submit"
                                class="btn btn-primary w-100"
                            >
                                Create Account
                            </button>

                        </form>


                        <div class="text-center mt-3">

                            <p class="mb-0">
                                Already have an account?
                            </p>

                            <a href="/login">
                                Login
                            </a>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>

</body>

</html>

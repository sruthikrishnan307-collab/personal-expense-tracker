
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Expense | ExpenseFlow</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body class="expense-form-page">

    <!-- NAVBAR -->

    <nav class="expense-navbar">

        <a href="/dashboard" class="brand">
            <span class="brand-icon">💰</span>
            ExpenseFlow
        </a>

        <a href="/dashboard" class="expense-nav-link">
            ← Back to Dashboard
        </a>

    </nav>

    <!-- BACKGROUND -->

    <div class="expense-bg-circle expense-circle-one"></div>
    <div class="expense-bg-circle expense-circle-two"></div>

    <!-- MAIN CONTENT -->

    <main class="expense-main">

        <div class="expense-form-card">

            <div class="expense-form-icon">✏️</div>

            <span class="expense-form-tag">TRANSACTION MANAGEMENT</span>

            <h1>Edit Expense</h1>

            <p class="expense-form-subtitle">
                Update your expense details and keep your records accurate.
            </p>

            <form method="POST">

                <!-- TITLE -->

                <div class="expense-field">

                    <label for="title">Expense Title</label>

                    <div class="expense-input-wrapper">

                        <span>📝</span>

                        <input
                            type="text"
                            id="title"
                            name="title"
                            value="{{ expense.title }}"
                            placeholder="Enter expense title"
                            required
                        >

                    </div>

                </div>

                <!-- AMOUNT -->

                <div class="expense-field">

                    <label for="amount">Amount (₹)</label>

                    <div class="expense-input-wrapper">

                        <span>₹</span>

                        <input
                            type="number"
                            id="amount"
                            name="amount"
                            value="{{ expense.amount }}"
                            min="0.01"
                            step="0.01"
                            placeholder="Enter amount"
                            required
                        >

                    </div>

                </div>

                <!-- CATEGORY -->

                <div class="expense-field">

                    <label for="category">Expense Category</label>

                    <div class="expense-input-wrapper">

                        <span>🏷️</span>

                        <select name="category" id="category" required>

                            <option value="Food"
                                {% if expense.category == "Food" %}selected{% endif %}>
                                🍔 Food
                            </option>

                            <option value="Travel"
                                {% if expense.category == "Travel" %}selected{% endif %}>
                                🚗 Travel
                            </option>

                            <option value="Bills"
                                {% if expense.category == "Bills" %}selected{% endif %}>
                                🧾 Bills
                            </option>

                            <option value="Entertainment"
                                {% if expense.category == "Entertainment" %}selected{% endif %}>
                                🎬 Entertainment
                            </option>

                            <option value="Shopping"
                                {% if expense.category == "Shopping" %}selected{% endif %}>
                                🛍️ Shopping
                            </option>

                            <option value="Other"
                                {% if expense.category == "Other" %}selected{% endif %}>
                                📦 Other
                            </option>

                        </select>

                    </div>

                </div>

                <!-- DATE -->

                <div class="expense-field">

                    <label for="date">Expense Date</label>

                    <div class="expense-input-wrapper">

                        <span>📅</span>

                        <input
                            type="date"
                            id="date"
                            name="date"
                            value="{{ expense.date }}"
                            required
                        >

                    </div>

                </div>

                <!-- UPDATE BUTTON -->

                <button type="submit" class="expense-submit-btn">
                    ✓ Update Expense
                </button>

            </form>

            <div class="expense-form-divider"></div>

            <a href="/dashboard" class="expense-back-link">
                ← Cancel and return to Dashboard
            </a>

            <div class="expense-security">
                🔒 Your financial records are private and secure.
            </div>

        </div>

        <p class="expense-bottom-text">
            Keep your financial records up to date with ExpenseFlow.
        </p>

    </main>

</body>
</html>

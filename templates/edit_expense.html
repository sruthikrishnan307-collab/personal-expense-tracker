<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Edit Expense</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

</head>

<body>

    <div class="container mt-5">

        <div class="row justify-content-center">

            <div class="col-md-6">

                <div class="card shadow">

                    <div class="card-body">

                        <h2 class="card-title text-center mb-4">
                            Edit Expense
                        </h2>

                        <form method="POST">

                            <!-- Title -->

                            <div class="mb-3">

                                <label class="form-label">
                                    Expense Title
                                </label>

                                <input
                                    type="text"
                                    name="title"
                                    class="form-control"
                                    value="{{ expense.title }}"
                                    required
                                >

                            </div>


                            <!-- Amount -->

                            <div class="mb-3">

                                <label class="form-label">
                                    Amount
                                </label>

                                <div class="input-group">

                                    <span class="input-group-text">
                                        ₹
                                    </span>

                                    <input
                                        type="number"
                                        name="amount"
                                        class="form-control"
                                        step="0.01"
                                        min="0"
                                        value="{{ expense.amount }}"
                                        required
                                    >

                                </div>

                            </div>


                            <!-- Category -->

                            <div class="mb-3">

                                <label class="form-label">
                                    Category
                                </label>

                                <select
                                    name="category"
                                    class="form-select"
                                    required
                                >

                                    <option value="Food"
                                        {% if expense.category == "Food" %}
                                            selected
                                        {% endif %}
                                    >
                                        Food
                                    </option>

                                    <option value="Travel"
                                        {% if expense.category == "Travel" %}
                                            selected
                                        {% endif %}
                                    >
                                        Travel
                                    </option>

                                    <option value="Bills"
                                        {% if expense.category == "Bills" %}
                                            selected
                                        {% endif %}
                                    >
                                        Bills
                                    </option>

                                    <option value="Entertainment"
                                        {% if expense.category == "Entertainment" %}
                                            selected
                                        {% endif %}
                                    >
                                        Entertainment
                                    </option>

                                    <option value="Shopping"
                                        {% if expense.category == "Shopping" %}
                                            selected
                                        {% endif %}
                                    >
                                        Shopping
                                    </option>

                                    <option value="Other"
                                        {% if expense.category == "Other" %}
                                            selected
                                        {% endif %}
                                    >
                                        Other
                                    </option>

                                </select>

                            </div>


                            <!-- Date -->

                            <div class="mb-4">

                                <label class="form-label">
                                    Date
                                </label>

                                <input
                                    type="date"
                                    name="date"
                                    class="form-control"
                                    value="{{ expense.date }}"
                                    required
                                >

                            </div>


                            <!-- Update -->

                            <button
                                type="submit"
                                class="btn btn-warning w-100"
                            >
                                Update Expense
                            </button>

                        </form>


                        <div class="text-center mt-3">

                            <a
                                href="/dashboard"
                                class="btn btn-outline-secondary"
                            >
                                Back to Dashboard
                            </a>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>

</body>

</html>

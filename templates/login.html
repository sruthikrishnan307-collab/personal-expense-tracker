
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | ExpenseFlow</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body class="auth-page">

    <div class="auth-background-circle circle-one"></div>
    <div class="auth-background-circle circle-two"></div>

    <nav class="auth-navbar">
        <a href="/" class="brand">
            <span class="brand-icon">💰</span>
            ExpenseFlow
        </a>

        <a href="/" class="auth-home-nav">← Back to Home</a>
    </nav>

    <main class="auth-main">

        <div class="auth-card">

            <div class="auth-icon">💜</div>

            <span class="auth-welcome">WELCOME BACK</span>

            <h1>Welcome Back!</h1>

            <p class="auth-subtitle">
                Login to continue managing your money smarter.
            </p>

            <form method="POST">

                <div class="auth-field">
                    <label for="username">Username</label>

                    <div class="auth-input-wrapper">
                        <span>👤</span>

                        <input
                            type="text"
                            id="username"
                            name="username"
                            placeholder="Enter your username"
                            autocomplete="username"
                            required
                        >
                    </div>
                </div>

                <div class="auth-field">
                    <label for="password">Password</label>

                    <div class="auth-input-wrapper">
                        <span>🔒</span>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required
                        >

                        <button
                            type="button"
                            class="password-toggle"
                            onclick="togglePassword()"
                            aria-label="Show password"
                        >
                            Show
                        </button>
                    </div>
                </div>

                <button type="submit" class="auth-btn">
                    Login to Account <span>→</span>
                </button>

            </form>

            <div class="auth-divider">
                <span>OR</span>
            </div>

            <p class="auth-footer">
                Don't have an account?
                <a href="{{ url_for('signup') }}">Create Account</a>
            </p>

            <div class="auth-security">
                <span>🔒</span>
                Your financial information stays protected.
            </div>

        </div>

        <div class="auth-bottom-text">
            Make smarter financial decisions with ExpenseFlow.
        </div>

    </main>

    <script>
        function togglePassword() {
            const password = document.getElementById("password");
            const toggle = document.querySelector(".password-toggle");

            if (password.type === "password") {
                password.type = "text";
                toggle.textContent = "Hide";
                toggle.setAttribute("aria-label", "Hide password");
            } else {
                password.type = "password";
                toggle.textContent = "Show";
                toggle.setAttribute("aria-label", "Show password");
            }
        }
    </script>

</body>
</html>

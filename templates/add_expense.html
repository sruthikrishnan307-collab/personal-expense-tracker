
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Expense | ExpenseFlow</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body class="expense-form-page">

    <!-- NAVBAR -->

    <nav class="expense-navbar">

        <a href="/dashboard" class="brand">
            <span class="brand-icon">💰</span>
            ExpenseFlow
        </a>

        <a href="/dashboard" class="expense-nav-link">
            ← Back to Dashboard
        </a>

    </nav>


    <!-- BACKGROUND -->

    <div class="expense-bg-circle expense-circle-one"></div>
    <div class="expense-bg-circle expense-circle-two"></div>


    <!-- MAIN CONTENT -->

    <main class="expense-main">

        <div class="expense-form-card">

            <div class="expense-form-icon">
                💸
            </div>

            <span class="expense-form-tag">TRANSACTION MANAGEMENT</span>

            <h1>Add New Expense</h1>

            <p class="expense-form-subtitle">
                Keep track of your spending and manage your money wisely.
            </p>


            <form method="POST">

                <!-- TITLE -->

                <div class="expense-field">

                    <label for="title">Expense Title</label>

                    <div class="expense-input-wrapper">

                        <span>📝</span>

                        <input
                            type="text"
                            id="title"
                            name="title"
                            placeholder="e.g. Grocery shopping"
                            required
                        >

                    </div>

                </div>


                <!-- AMOUNT -->

                <div class="expense-field">

                    <label for="amount">Amount (₹)</label>

                    <div class="expense-input-wrapper">

                        <span>₹</span>

                        <input
                            type="number"
                            id="amount"
                            name="amount"
                            placeholder="Enter expense amount"
                            min="0.01"
                            step="0.01"
                            required
                        >

                    </div>

                </div>


                <!-- CATEGORY -->

                <div class="expense-field">

                    <label for="category">Expense Category</label>

                    <div class="expense-input-wrapper">

                        <span>🏷️</span>

                        <select name="category" id="category" required>

                            <option value="" disabled selected>
                                Select a category
                            </option>

                            <option value="Food">🍔 Food</option>
                            <option value="Travel">🚗 Travel</option>
                            <option value="Bills">🧾 Bills</option>
                            <option value="Entertainment">🎬 Entertainment</option>
                            <option value="Shopping">🛍️ Shopping</option>
                            <option value="Other">📦 Other</option>

                        </select>

                    </div>

                </div>


                <!-- DATE -->

                <div class="expense-field">

                    <label for="date">Expense Date</label>

                    <div class="expense-input-wrapper">

                        <span>📅</span>

                        <input
                            type="date"
                            id="date"
                            name="date"
                            required
                        >

                    </div>

                </div>


                <!-- SUBMIT -->

                <button type="submit" class="expense-submit-btn">
                    <span>＋</span> Save Expense
                </button>

            </form>


            <!-- FOOTER -->

            <div class="expense-form-divider"></div>

            <a href="/dashboard" class="expense-back-link">
                ← Cancel and return to Dashboard
            </a>

            <div class="expense-security">
                🔒 Your financial records are private and secure.
            </div>

        </div>


        <p class="expense-bottom-text">
            Every expense tracked is a step towards smarter spending.
        </p>

    </main>


    <script>
        // Automatically select today's date
        document.getElementById("date").value =
            new Date().toLocaleDateString("en-CA");
    </script>

</body>
</html>
